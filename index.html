<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1120" />
    <meta name="twitter:title" content="Word Atlas · Mỗi từ một bức tranh, thắp sáng IELTS" />
    <meta name="twitter:image" content="https://0xlei.tech/words/brand/og-card.jpg" />
    <title>Word Atlas · Mỗi từ một bức tranh, thắp sáng IELTS</title>
    <meta name="description" content="7.298 từ vựng IELTS cốt lõi với hình minh họa, phát âm Anh/Mỹ và ví dụ nguyên bản. Học một từ, thắp sáng một vì sao." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Word Atlas · Mỗi từ một bức tranh, thắp sáng IELTS" />
    <meta property="og:description" content="7.298 từ vựng IELTS, mỗi từ đều có một bức tranh minh họa. Học một từ, thắp sáng một vì sao." />
    <meta property="og:image" content="https://0xlei.tech/words/brand/og-card.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" href="%BASE_URL%atlas/index.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Apply the saved theme (dark by default) before first paint.
      (function () {
        var t = "dark";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
      // Unregister any legacy service workers to prevent Safari reload loop
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }

      // Diagnostic error overlay for mobile devices
      window.__moduleExecuted = false;
      function showDiag(title, msg, color) {
        var el = document.getElementById("diag-banner");
        if (!el) {
          el = document.createElement("div");
          el.id = "diag-banner";
          el.style.cssText = "position:fixed;top:12px;left:12px;right:12px;z-index:999999;padding:14px;border-radius:10px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#fff;word-break:break-word;box-shadow:0 8px 24px rgba(0,0,0,0.6);";
          (document.body || document.documentElement).appendChild(el);
        }
        el.style.background = color || "#b91c1c";
        el.innerHTML = "<strong>" + title + "</strong><br><div style='margin-top:6px;font-family:monospace;font-size:12px;opacity:0.95;white-space:pre-wrap;'>" + msg + "</div>";
      }

      window.addEventListener("error", function (e) {
        var loc = (e.filename || "") + (e.lineno ? ":" + e.lineno : "") + (e.colno ? ":" + e.colno : "");
        var detail = (e.message || "Unknown error") + (loc ? "\n" + loc : "") + (e.error && e.error.stack ? "\n" + e.error.stack : "");
        showDiag("⚠️ LỖI JAVASCRIPT:", detail, "#b91c1c");
      });

      window.addEventListener("unhandledrejection", function (e) {
        var reason = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : "Unknown rejection";
        showDiag("⚠️ LỖI PROMISE / BẤT ĐỒNG BỘ:", String(reason), "#b91c1c");
      });

      setTimeout(function () {
        if (!window.__moduleExecuted && !document.getElementById("diag-banner")) {
          showDiag("⚠️ CẢNH BÁO TẢI GÓI:", "Mã JavaScript (module) chưa hoàn tất tải sau 4s. Trình duyệt có thể bị chặn hoặc mất kết nối CDN.", "#d97706");
        }
      }, 4000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      window.__moduleExecuted = true;
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
